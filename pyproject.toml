[project]
name = "llm-news-agent"
version = "0.1.0"
description = "LLM-powered financial news agent that fetches, summarizes, and analyzes market impact"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.25",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
local = [
    "transformers>=4.45",
    "torch>=2.1",
    "accelerate>=1.0",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
news-agent = "news_agent.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
